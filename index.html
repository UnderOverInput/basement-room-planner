const DIRS={top:new THREE.Vector3(0,1,0.0001),front:new THREE.Vector3(0,0.35,1),side:new THREE.Vector3(1,0.35,0),iso:new THREE.Vector3(0.8,0.95,1.1)};
let curView='iso',anim=null,locked=false;
function framePose(name){const d=DIRS[name].clone().normalize();const tgt=new THREE.Vector3(0,0,0);const up=new THREE.Vector3(0,1,0);

 anim={t0:performance.now(),dur:650,p0:cam.position.clone(),t0v:oc.target.clone(),p1:p.pos,t1:p.tgt};}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(mode!=='orbit')setMode('orbit');if(locked&&b.dataset.v!=='top')setLock(false);goView(b.dataset.v);});

function setLock(on){locked=on;document.getElementById('lock').classList.toggle('on',on);oc.enableRotate=!on;if(on){if(mode!=='orbit')setMode('orbit');goView('top');}}
document.getElementById('lock').onclick=()=>setLock(!locked);
// load room
let room;new GLTFLoader().load('room.glb',g=>{room=g.scene;room.rotation.y=ROOM_ROT;room.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.material.side=THREE.DoubleSide;o.material.clippingPlanes=[clip];}});S.add(room);window.roomLoaded=true;document.getElementById('load').remove();},undefined,()=>{document.getElementById('load').textContent='Could not load room scan';});
// furniture list
const byCat={};catalog.forEach(c=>(byCat[c.category]??=[]).push(c));const L=document.getElementById('list');

function addItem(id,s){const c=cat(id);if(!c)return;const g=c.build();g.position.set(s.x||0,0,s.z||0);g.userData.itemId=id;setRot(g,s.r||0);if(s.c){setColor(g,s.c);g.userData.color=s.c;}clampObj(g);S.add(g);items.push(g);return g;}
function setRot(o,deg){o.userData.rot=((Math.round(deg)%360)+360)%360;o.rotation.y=o.userData.rot*Math.PI/180;}
// selection outline
let sel=null,outline=null;const selUI=document.getElementById('sel');
function makeOutline(o){const c=cat(o.userData.itemId),g=new THREE.Group();const geo=new THREE.EdgesGeometry(new THREE.BoxGeometry(c.dims.w+0.06,c.dims.h+0.04,c.dims.d+0.06));const l=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x4d8dff,depthTest:false}));l.position.y=c.dims.h/2;l.renderOrder=9;g.add(l);
 const ring=new THREE.Mesh(new THREE.PlaneGeometry(c.dims.w+0.12,c.dims.d+0.12),new THREE.MeshBasicMaterial({color:0x3b6fd8,transparent:true,opacity:0.25,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.y=0.01;g.add(ring);return g;}
function syncOutline(){if(outline&&sel){outline.position.copy(sel.position);outline.rotation.y=sel.rotation.y;}}
function select(o){sel=o;if(outline){S.remove(outline);outline=null;}if(!o){selUI.style.display='none';hint();return;}outline=makeOutline(o);S.add(outline);syncOutline();const c=cat(o.userData.itemId);selUI.style.display='flex';document.getElementById('selName').textContent=c.name;document.getElementById('selDim').textContent=`${ft(c.dims.w)} W × ${ft(c.dims.d)} D × ${ft(c.dims.h)} H`;let col='#888888';o.traverse(m=>{if(m.isMesh&&m.material.__main)col='#'+m.material.color.getHexString();});document.getElementById('col').value=col;syncRotUI();hint();}
const rotS=document.getElementById('rotS');function syncRotUI(){if(!sel)return;rotS.value=sel.userData.rot;document.getElementById('rotV').textContent=sel.userData.rot+'°';}
rotS.oninput=()=>{if(!sel)return;setRot(sel,+rotS.value);clampObj(sel);syncOutline();syncRotUI();};
const snapA=document.getElementById('snapA'),snapG=document.getElementById('snapG');snapA.onchange=()=>rotS.step=snapA.checked?15:1;
function rot(d){if(!sel)return;setRot(sel,sel.userData.rot+d);clampObj(sel);syncOutline();syncRotUI();}
document.getElementById('col').oninput=e=>{if(sel){setColor(sel,e.target.value);sel.userData.color=e.target.value;}};
const dup=()=>{if(sel)select(addItem(sel.userData.itemId,{x:sel.position.x+0.3,z:sel.position.z+0.3,r:sel.userData.rot,c:sel.userData.color}));};document.getElementById('dup').onclick=dup;
const del=()=>{if(!sel)return;S.remove(sel);items.splice(items.indexOf(sel),1);select(null);};document.getElementById('del').onclick=del;document.getElementById('desel').onclick=()=>select(null);
const keys={};
addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName)&&e.target.type!=='range')return;keys[e.code]=true;const k=e.key.toLowerCase();
 if(k==='delete'||k==='backspace'){del();e.preventDefault();}else if(k==='escape')select(null);else if(k==='r')rot(e.shiftKey?15:-15);else if(k==='f'){if(mode!=='orbit')setMode('orbit');goView(curView);}else if(k==='d'&&mode==='orbit')dup();});

// picking & drag
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),nd=new THREE.Vector2();let drag=null,off=new THREE.Vector3(),downAt=null,look=null,pointers=0;
function ndc(e){const r=cv.getBoundingClientRect();nd.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(nd,cam);}

cv.addEventListener('pointerdown',e=>{pointers++;if(pointers>1){if(drag){drag=null;}return;}if(e.button!==0)return;ndc(e);downAt={x:e.clientX,y:e.clientY};const o=hitItem();

 else if(look){tyaw-=(e.clientX-look.x)*0.004;tpitch=THREE.MathUtils.clamp(tpitch-(e.clientY-look.y)*0.004,-1.2,1.2);look={x:e.clientX,y:e.clientY};}});

// walk
let mode='orbit',yaw=0,pitch=0,tyaw=0,tpitch=0,walkTo=null,joy={x:0,y:0};
function setMode(m){mode=m;document.getElementById('mOrbit').classList.toggle('on',m==='orbit');document.getElementById('mWalk').classList.toggle('on',m==='walk');oc.enabled=m==='orbit';anim=null;

 if(m==='walk'){if(locked)setLock(false);cam.position.set(0,EYE,B.z1-0.6);yaw=tyaw=0;pitch=tpitch=-0.08;cam.fov=60;}else{cam.fov=48;cam.up.set(0,1,0);goView(curView,false);}cam.updateProjectionMatrix();hint();}
document.getElementById('mOrbit').onclick=()=>setMode('orbit');document.getElementById('mWalk').onclick=()=>setMode('walk');
const J=document.getElementById('joy'),Ji=J.querySelector('i');J.addEventListener('pointermove',e=>{if(!e.buttons&&e.pointerType!=='touch')return;const r=J.getBoundingClientRect();let x=(e.clientX-r.left-55)/55,y=(e.clientY-r.top-55)/55;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}joy={x,y};Ji.style.transform=`translate(${x*35}px,${y*35}px)`;});

 else if(touch)t='1 finger: rotate · 2 fingers: pan & pinch zoom · tap item to select, drag to move';
 else t='Left-drag: rotate · Right-drag: pan · Wheel: zoom · Drag items to move · R rotate · D duplicate · Del delete · Esc deselect · F fit';

// compass

 if(mode==='walk'){let f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,s=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;const sp=1.6*dt;

// layouts
const ser=()=>items.map(o=>({i:o.userData.itemId,x:+o.position.x.toFixed(2),z:+o.position.z.toFixed(2),r:o.userData.rot,...(o.userData.color?{c:o.userData.color}:{})}));
function load(arr){items.slice().forEach(o=>S.remove(o));items.length=0;select(null);(arr||[]).forEach(s=>addItem(s.i,s));}
const LS='basementLayouts';const getL=()=>JSON.parse(localStorage.getItem(LS)||'{}');
function refreshL(){const s=document.getElementById('layouts');s.innerHTML='<option value="">Layouts…</option>'+Object.keys(getL()).map(k=>`<option>${k.replace(/</g,'&lt;')}</option>`).join('');}refreshL();
document.getElementById('save').onclick=()=>{const n=prompt('Layout name','Layout '+(Object.keys(getL()).length+1));if(!n)return;const l=getL();l[n]=ser();localStorage.setItem(LS,JSON.stringify(l));refreshL();toast('Saved “'+n+'”');};
document.getElementById('layouts').onchange=e=>{if(e.target.value)load(getL()[e.target.value]);};
document.getElementById('clear').onclick=()=>load([]);
function toast(t){const T=document.getElementById('toast');T.textContent=t;T.style.display='block';clearTimeout(T._t);T._t=setTimeout(()=>T.style.display='none',2200);}
const enc=a=>btoa(unescape(encodeURIComponent(JSON.stringify(a)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
document.getElementById('share').onclick=async()=>{location.hash='l='+enc(ser());const u=location.href;try{if(navigator.share&&touch)await navigator.share({title:'Room layout',url:u});else{await navigator.clipboard.writeText(u);toast('Link copied');}}catch{toast('Link is in the address bar');}};
function fromHash(){const m=location.hash.match(/l=([\w-]+)/);if(m)try{load(dec(m[1]));}catch(e){console.warn('bad layout link');}}fromHash();addEventListener('hashchange',fromHash);
document.getElementById('sideHead').onclick=()=>{};
window.planner={items,addItem,ser,enc,dec,load,select,cam,goView,setLock,isAnimating:()=>!!anim,
 framed(){cam.updateMatrixWorld();let ok=true;for(const x of[B.x0,B.x1])for(const z of[B.z0,B.z1]){const v=new THREE.Vector3(x,0,z).project(cam);if(Math.abs(v.x)>1.001||Math.abs(v.y)>1.001)ok=false;}return ok;}};
</script></body></html>
