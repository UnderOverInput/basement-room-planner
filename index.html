import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const B={x0:-4.26,x1:4.26,z0:-3.07,z1:3.07,ceil:3.9};const EYE=1.676,ROOM_ROT=-1.58*Math.PI/180,GRID=0.1524;

const oc=new OrbitControls(cam,cv);oc.enableDamping=true;oc.dampingFactor=0.1;oc.zoomToCursor=true;oc.screenSpacePanning=false;oc.minDistance=1.2;oc.maxDistance=40;oc.maxPolarAngle=Math.PI/2-0.03;oc.zoomSpeed=0.9;

oc.addEventListener('change',()=>{const t=oc.target;t.x=THREE.MathUtils.clamp(t.x,B.x0-2,B.x1+2);t.z=THREE.MathUtils.clamp(t.z,B.z0-2,B.z1+2);t.y=THREE.MathUtils.clamp(t.y,0,2);if(cam.position.y<0.15)cam.position.y=0.15;});

// wall labels
function label(t,x,z){const c=document.createElement('canvas');c.width=128;c.height=64;const g=c.getContext('2d');g.fillStyle='#000a';g.beginPath();g.roundRect(4,8,120,48,12);g.fill();g.fillStyle='#fff';g.font='bold 30px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(t,64,33);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(0.9,0.45,1);s.position.set(x,0.3,z);s.renderOrder=5;S.add(s);}
label('N wall',0,B.z0+0.3);label('S wall',0,B.z1-0.3);label('E',B.x1-0.3,0);label('W',B.x0+0.3,0);
// sizing
function viewSize(){const r=view.getBoundingClientRect();return [Math.max(1,r.width),Math.max(1,r.height)];}
function resize(){const [w,h]=viewSize();R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(w,h,false);const th=Math.min(document.getElementById('top').offsetHeight+4,h*0.45);cam.aspect=w/(h-th);cam.setViewOffset(w,h-th,0,-th,w,h);cam.updateProjectionMatrix();if(mode==='orbit')goView(curView,false);}
new ResizeObserver(resize).observe(view);document.getElementById('side')?.addEventListener('transitionend',()=>resize());
// framing
const DIRS={top:new THREE.Vector3(0,1,0.0001),front:new THREE.Vector3(0,0.35,1),side:new THREE.Vector3(1,0.35,0),iso:new THREE.Vector3(0.8,0.95,1.1)};
let curView='iso',anim=null,locked=false;
function framePose(name){const d=DIRS[name].clone().normalize();const tgt=new THREE.Vector3(0,0,0);const up=new THREE.Vector3(0,1,0);
 const fwd=d.clone().negate(),right=new THREE.Vector3().crossVectors(fwd,up);if(right.lengthSq()<1e-6)right.set(1,0,0);right.normalize();const u=new THREE.Vector3().crossVectors(right,fwd);
 const tv=Math.tan(THREE.MathUtils.degToRad(cam.fov/2)),th=tv*cam.aspect;let D=0;const hY=name==='top'?0:2.4;
 for(const x of[B.x0,B.x1])for(const y of[0,hY])for(const z of[B.z0,B.z1]){const c=new THREE.Vector3(x,y,z);D=Math.max(D,c.dot(d)+Math.abs(c.dot(right))/th,c.dot(d)+Math.abs(c.dot(u))/tv);}
 D*=1.08;return {pos:d.multiplyScalar(D),tgt};}

 anim={t0:performance.now(),dur:650,p0:cam.position.clone(),t0v:oc.target.clone(),p1:p.pos,t1:p.tgt};}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(mode!=='orbit')setMode('orbit');if(locked&&b.dataset.v!=='top')setLock(false);goView(b.dataset.v);});

const items=[];const cat=id=>catalog.find(c=>c.id===id);

// selection outline
let sel=null,outline=null;const selUI=document.getElementById('sel');
function makeOutline(o){const c=cat(o.userData.itemId),g=new THREE.Group();const geo=new THREE.EdgesGeometry(new THREE.BoxGeometry(c.dims.w+0.06,c.dims.h+0.04,c.dims.d+0.06));const l=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({color:0x4d8dff,depthTest:false}));l.position.y=c.dims.h/2;l.renderOrder=9;g.add(l);
